name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Formats, typechecks, lints and tests the source on every supported OS and Node version.
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18.0', '24', '26']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  # Installs the packed tarball outside the checkout and runs both bins, as a user would get them from npm.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Check tarball contents
        shell: bash
        run: |
          diff <(printf '%s\n' package/LICENSE package/README.md package/dist/cli.js package/package.json | LC_ALL=C sort) \
               <(tar -tzf "$RUNNER_TEMP"/pack/*.tgz | LC_ALL=C sort)
      - name: Install and run the tarball
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/pack/*.tgz
          test "$("$RUNNER_TEMP/prefix/bin/grimoire" --version)" = "$version"
          test "$("$RUNNER_TEMP/prefix/bin/grim" --version)" = "$version"

  # The single check the branch ruleset requires: passes only if every job above did.
  gate:
    name: CI gate
    needs: [verify, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
